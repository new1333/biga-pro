version: 1
reference_syntax: '<Term id="pe" />'
terms:
  - id: securities
    name: "证券"
    category: "基础概念"
    difficulty: beginner
    description: "代表一定财产权利或收益权利的金融凭证，股票、债券、基金份额等都属于证券。"
    aliases: ["Security", "有价证券"]
    prerequisites: []

  - id: stock
    name: "股票"
    category: "基础概念"
    difficulty: beginner
    description: "上市公司发行的所有权凭证，持有人通常享有分红、表决和价格变动带来的权益或风险。"
    aliases: ["股份", "普通股", "Stock", "Share"]
    prerequisites: [securities]

  - id: share
    name: "股份"
    category: "基础概念"
    difficulty: beginner
    description: "公司资本被划分后的基本权益单位，是股票所代表的所有权份额。"
    aliases: ["股", "Share"]
    prerequisites: [stock]

  - id: listed-company
    name: "上市公司"
    category: "基础概念"
    difficulty: beginner
    description: "股票在证券交易所公开交易，并需要按规则进行信息披露的公司。"
    aliases: ["公众公司", "Public Company"]
    prerequisites: [stock]

  - id: shareholder
    name: "股东"
    category: "基础概念"
    difficulty: beginner
    description: "持有公司股份并享有相应股东权利的个人或机构。"
    aliases: ["Shareholder"]
    prerequisites: [share]

  - id: equity
    name: "股权"
    category: "基础概念"
    difficulty: beginner
    description: "股东基于持股比例对公司拥有的权益，包括收益权、表决权等。"
    aliases: ["Equity", "所有者权益"]
    prerequisites: [shareholder]

  - id: market-cap
    name: "市值"
    category: "基础概念"
    difficulty: beginner
    description: "公司股票总价值，通常等于股票价格乘以总股本。"
    aliases: ["总市值", "Market Cap", "市价总值"]
    prerequisites: [stock]

  - id: total-share-capital
    name: "总股本"
    category: "基础概念"
    difficulty: beginner
    description: "公司已发行股份总数，包括流通股和限售股。"
    aliases: ["Total Shares"]
    prerequisites: [share]

  - id: free-float
    name: "流通股本"
    category: "基础概念"
    difficulty: beginner
    description: "可以在二级市场自由交易的股份数量。"
    aliases: ["流通股", "Free Float"]
    prerequisites: [total-share-capital]

  - id: float-market-cap
    name: "流通市值"
    category: "基础概念"
    difficulty: beginner
    description: "可流通股份对应的市场价值，通常等于股价乘以流通股本。"
    aliases: ["Free-float Market Cap"]
    prerequisites: [market-cap, free-float]

  - id: dividend
    name: "分红"
    category: "基础概念"
    difficulty: beginner
    description: "公司将利润的一部分分配给股东的行为，常见形式包括现金分红和股票分红。"
    aliases: ["派息", "Dividend"]
    prerequisites: [shareholder]

  - id: dividend-yield
    name: "股息率"
    category: "估值与收益"
    difficulty: intermediate
    description: "每股现金分红与股票价格的比率，用于衡量股息收入相对股价的水平。"
    aliases: ["Dividend Yield"]
    prerequisites: [dividend, stock]

  - id: dividend-payout-ratio
    name: "分红率"
    category: "财务指标"
    difficulty: intermediate
    description: "公司分红金额占净利润的比例，用于观察利润分配力度。"
    aliases: ["派息率", "Payout Ratio"]
    prerequisites: [dividend, net-profit]

  - id: bonus-share
    name: "送股"
    category: "公司行为"
    difficulty: intermediate
    description: "公司以股票形式向股东分配权益，股东持股数量增加但公司总价值不因送股本身改变。"
    aliases: ["股票股利", "Bonus Share"]
    prerequisites: [dividend, share]

  - id: rights-issue
    name: "配股"
    category: "公司行为"
    difficulty: intermediate
    description: "上市公司向原股东按持股比例发行新股并融资的行为。"
    aliases: ["Rights Issue"]
    prerequisites: [shareholder, stock]

  - id: share-repurchase
    name: "股份回购"
    category: "公司行为"
    difficulty: intermediate
    description: "公司使用资金买回自身股份，可能影响每股指标、资本结构和市场预期。"
    aliases: ["回购", "Buyback", "Share Repurchase"]
    prerequisites: [listed-company, share]

  - id: delisting
    name: "退市"
    category: "市场制度"
    difficulty: intermediate
    description: "上市公司股票因触发规则或主动申请而退出交易所公开交易。"
    aliases: ["摘牌", "Delisting"]
    prerequisites: [listed-company]

  - id: st-stock
    name: "ST股票"
    category: "市场制度"
    difficulty: intermediate
    description: "因财务或其他异常状况被实施特别处理的 A 股股票，风险提示属性更强。"
    aliases: ["特别处理股票", "*ST"]
    prerequisites: [a-share, delisting]

  - id: blue-chip
    name: "蓝筹股"
    category: "股票类型"
    difficulty: beginner
    description: "通常指规模较大、经营相对稳定、市场认可度较高的公司股票。"
    aliases: ["Blue Chip"]
    prerequisites: [stock]

  - id: growth-stock
    name: "成长股"
    category: "股票类型"
    difficulty: intermediate
    description: "市场预期收入或利润增长较快的公司股票，估值通常更依赖未来增长。"
    aliases: ["Growth Stock"]
    prerequisites: [stock, valuation]

  - id: value-stock
    name: "价值股"
    category: "股票类型"
    difficulty: intermediate
    description: "相对基本面或资产价值而言价格较低的股票，常与低估值、高分红等特征相关。"
    aliases: ["Value Stock"]
    prerequisites: [stock, valuation]

  - id: cyclical-stock
    name: "周期股"
    category: "股票类型"
    difficulty: intermediate
    description: "业绩与宏观经济、商品价格或行业周期高度相关的股票。"
    aliases: ["Cyclical Stock"]
    prerequisites: [stock, business-cycle]

  - id: defensive-stock
    name: "防御型股票"
    category: "股票类型"
    difficulty: intermediate
    description: "需求相对稳定、受经济周期影响较小的公司股票。"
    aliases: ["Defensive Stock"]
    prerequisites: [stock, business-cycle]

  - id: concept-stock
    name: "概念股"
    category: "股票类型"
    difficulty: beginner
    description: "因某一主题、政策、技术或事件预期而受到市场关注的股票。"
    aliases: ["主题股", "Concept Stock"]
    prerequisites: [stock, thematic-investing]

  - id: sector
    name: "板块"
    category: "市场结构"
    difficulty: beginner
    description: "按行业、主题、地区或风格等标准划分的一组股票。"
    aliases: ["Sector", "概念板块"]
    prerequisites: [stock]

  - id: industry
    name: "行业"
    category: "市场结构"
    difficulty: beginner
    description: "具有相似产品、服务或商业模式的公司集合。"
    aliases: ["Industry"]
    prerequisites: [listed-company]

  - id: thematic-investing
    name: "主题投资"
    category: "投资方法"
    difficulty: intermediate
    description: "围绕政策、技术、产业趋势或社会变化等主题选择投资标的的方法。"
    aliases: ["Theme Investing"]
    prerequisites: [sector, industry]

  - id: a-share
    name: "A股"
    category: "市场与品种"
    difficulty: beginner
    description: "在中国内地交易所上市、通常以人民币计价交易的股票。"
    aliases: ["人民币普通股", "A Share", "A股市场"]
    prerequisites: [stock]

  - id: b-share
    name: "B股"
    category: "市场与品种"
    difficulty: beginner
    description: "在中国内地交易所上市、以外币计价交易的股票品种。"
    aliases: ["境内上市外资股", "B Share"]
    prerequisites: [stock]

  - id: h-share
    name: "H股"
    category: "市场与品种"
    difficulty: beginner
    description: "注册地在中国内地、在香港交易所上市交易的公司股票。"
    aliases: ["H Share", "国企股"]
    prerequisites: [stock, hk-stock]

  - id: hk-stock
    name: "港股"
    category: "市场与品种"
    difficulty: beginner
    description: "在香港证券市场上市交易的股票。"
    aliases: ["香港股票", "Hong Kong Stocks"]
    prerequisites: [stock]

  - id: us-stock
    name: "美股"
    category: "市场与品种"
    difficulty: beginner
    description: "在美国证券市场上市交易的股票。"
    aliases: ["美国股票", "US Stocks"]
    prerequisites: [stock]

  - id: main-board
    name: "主板"
    category: "市场与品种"
    difficulty: beginner
    description: "服务较成熟企业的股票上市板块，是 A 股主要交易板块之一。"
    aliases: ["主板市场"]
    prerequisites: [a-share]

  - id: star-market
    name: "科创板"
    category: "市场与品种"
    difficulty: intermediate
    description: "上海证券交易所面向科技创新企业设立的股票板块，实行注册制和差异化交易规则。"
    aliases: ["STAR Market", "科创板市场"]
    prerequisites: [a-share, registration-system]

  - id: chinext
    name: "创业板"
    category: "市场与品种"
    difficulty: intermediate
    description: "深圳证券交易所面向成长型创新创业企业设立的股票板块。"
    aliases: ["ChiNext"]
    prerequisites: [a-share, registration-system]

  - id: beijing-stock-exchange
    name: "北交所"
    category: "市场与品种"
    difficulty: intermediate
    description: "北京证券交易所，主要服务创新型中小企业。"
    aliases: ["BSE", "北京证券交易所"]
    prerequisites: [a-share]

  - id: neeq
    name: "新三板"
    category: "市场与品种"
    difficulty: intermediate
    description: "全国中小企业股份转让系统，服务非上市公众公司股份转让。"
    aliases: ["全国股转系统", "NEEQ"]
    prerequisites: [securities]

  - id: shanghai-stock-exchange
    name: "上交所"
    category: "交易场所"
    difficulty: beginner
    description: "上海证券交易所，是中国内地主要证券交易所之一。"
    aliases: ["SSE", "上海证券交易所"]
    prerequisites: [securities]

  - id: shenzhen-stock-exchange
    name: "深交所"
    category: "交易场所"
    difficulty: beginner
    description: "深圳证券交易所，是中国内地主要证券交易所之一。"
    aliases: ["SZSE", "深圳证券交易所"]
    prerequisites: [securities]

  - id: hong-kong-stock-exchange
    name: "港交所"
    category: "交易场所"
    difficulty: beginner
    description: "香港交易及结算所有限公司运营的证券交易市场。"
    aliases: ["HKEX", "香港交易所"]
    prerequisites: [hk-stock]

  - id: nyse
    name: "纽约证券交易所"
    category: "交易场所"
    difficulty: beginner
    description: "美国主要证券交易所之一，上市公司以大型成熟企业为主。"
    aliases: ["NYSE", "纽交所"]
    prerequisites: [us-stock]

  - id: nasdaq
    name: "纳斯达克"
    category: "交易场所"
    difficulty: beginner
    description: "美国主要证券交易市场之一，科技和成长型公司占比较高。"
    aliases: ["NASDAQ"]
    prerequisites: [us-stock]

  - id: stock-connect
    name: "沪深港通"
    category: "跨市场机制"
    difficulty: intermediate
    description: "内地与香港股票市场之间的互联互通交易机制。"
    aliases: ["互联互通", "Stock Connect"]
    prerequisites: [a-share, hk-stock]

  - id: northbound-trading
    name: "北向交易"
    category: "跨市场机制"
    difficulty: intermediate
    description: "境外投资者通过互联互通机制买卖沪深交易所股票的交易方向。"
    aliases: ["北向资金", "Northbound Trading"]
    prerequisites: [stock-connect, a-share]

  - id: southbound-trading
    name: "南向交易"
    category: "跨市场机制"
    difficulty: intermediate
    description: "内地投资者通过互联互通机制买卖香港市场股票的交易方向。"
    aliases: ["南向资金", "Southbound Trading"]
    prerequisites: [stock-connect, hk-stock]

  - id: qfii
    name: "合格境外机构投资者"
    category: "跨市场机制"
    difficulty: advanced
    description: "符合条件的境外机构投资者依法投资境内证券市场的制度安排。"
    aliases: ["QFII", "RQFII"]
    prerequisites: [securities, a-share]

  - id: rmb
    name: "人民币"
    category: "货币"
    difficulty: beginner
    description: "中国法定货币，A 股通常以人民币计价交易。"
    aliases: ["CNY", "人民币元"]
    prerequisites: []

  - id: hkd
    name: "港元"
    category: "货币"
    difficulty: beginner
    description: "香港法定货币，港股通常以港元计价交易。"
    aliases: ["HKD", "港币"]
    prerequisites: []

  - id: usd
    name: "美元"
    category: "货币"
    difficulty: beginner
    description: "美国法定货币，美股通常以美元计价交易。"
    aliases: ["USD", "美金"]
    prerequisites: []

  - id: trading-account
    name: "证券账户"
    category: "交易基础"
    difficulty: beginner
    description: "用于记录投资者持有和交易证券的账户。"
    aliases: ["股东账户"]
    prerequisites: [securities]

  - id: brokerage-account
    name: "资金账户"
    category: "交易基础"
    difficulty: beginner
    description: "投资者在证券公司开立的资金结算账户，用于证券交易资金划转。"
    aliases: ["证券资金账户"]
    prerequisites: [trading-account]

  - id: trading-day
    name: "交易日"
    category: "交易基础"
    difficulty: beginner
    description: "证券市场按规则开放交易的日期。"
    aliases: ["Trading Day"]
    prerequisites: [securities]

  - id: trading-session
    name: "交易时段"
    category: "交易基础"
    difficulty: beginner
    description: "交易日内可以进行报价、撮合或成交的具体时间段。"
    aliases: ["交易时间", "Trading Session"]
    prerequisites: [trading-day]

  - id: call-auction
    name: "集合竞价"
    category: "交易规则"
    difficulty: intermediate
    description: "在规定时间内集中接收买卖申报，并按规则一次性撮合成交的交易方式。"
    aliases: ["Opening Call Auction", "Closing Call Auction"]
    prerequisites: [order]

  - id: continuous-auction
    name: "连续竞价"
    category: "交易规则"
    difficulty: beginner
    description: "交易时段内买卖申报持续进入系统并按价格优先、时间优先等规则撮合的交易方式。"
    aliases: ["Continuous Auction"]
    prerequisites: [order]

  - id: lot
    name: "交易单位"
    category: "交易规则"
    difficulty: beginner
    description: "买卖证券时规定的最小申报数量单位，A 股股票常以手为单位。"
    aliases: ["一手", "手", "Board Lot"]
    prerequisites: [stock]

  - id: tick-size
    name: "最小变动价位"
    category: "交易规则"
    difficulty: beginner
    description: "证券报价可以变动的最小价格单位。"
    aliases: ["最小报价单位", "Tick Size"]
    prerequisites: [order]

  - id: t-plus-one
    name: "T+1"
    category: "交易规则"
    difficulty: beginner
    description: "交易发生后的下一个交易日才能完成某些交收或卖出限制的制度。"
    aliases: ["T加1", "T+1交易制度"]
    prerequisites: [trading-day]

  - id: price-limit
    name: "涨跌幅限制"
    category: "交易规则"
    difficulty: beginner
    description: "交易所对证券单日价格涨跌幅度设置的限制。"
    aliases: ["涨跌停限制", "Price Limit"]
    prerequisites: [a-share]

  - id: limit-up
    name: "涨停"
    category: "交易规则"
    difficulty: beginner
    description: "证券价格达到当日允许上涨的最高限制。"
    aliases: ["涨停板", "Limit Up"]
    prerequisites: [price-limit]

  - id: limit-down
    name: "跌停"
    category: "交易规则"
    difficulty: beginner
    description: "证券价格达到当日允许下跌的最低限制。"
    aliases: ["跌停板", "Limit Down"]
    prerequisites: [price-limit]

  - id: suspension
    name: "停牌"
    category: "交易规则"
    difficulty: intermediate
    description: "证券在一段时间内暂停交易的状态。"
    aliases: ["Trading Halt"]
    prerequisites: [stock]

  - id: resumption
    name: "复牌"
    category: "交易规则"
    difficulty: intermediate
    description: "停牌证券恢复交易的状态。"
    aliases: ["Resume Trading"]
    prerequisites: [suspension]

  - id: ipo
    name: "首次公开发行"
    category: "发行融资"
    difficulty: beginner
    description: "公司首次向公众发行股票并申请上市交易的过程。"
    aliases: ["IPO", "新股发行", "首发上市"]
    prerequisites: [stock, listed-company]

  - id: new-share-subscription
    name: "打新"
    category: "发行融资"
    difficulty: intermediate
    description: "投资者参与新股申购的行为。"
    aliases: ["新股申购", "IPO Subscription"]
    prerequisites: [ipo, trading-account]

  - id: primary-market
    name: "一级市场"
    category: "市场结构"
    difficulty: beginner
    description: "证券首次发行和融资发生的市场。"
    aliases: ["发行市场", "Primary Market"]
    prerequisites: [securities]

  - id: secondary-market
    name: "二级市场"
    category: "市场结构"
    difficulty: beginner
    description: "已发行证券在投资者之间流通买卖的市场。"
    aliases: ["流通市场", "Secondary Market"]
    prerequisites: [securities]

  - id: margin-trading
    name: "融资交易"
    category: "杠杆交易"
    difficulty: advanced
    description: "投资者向证券公司借入资金买入证券的交易方式。"
    aliases: ["融资买入", "Margin Trading"]
    prerequisites: [brokerage-account, leverage]

  - id: short-selling
    name: "融券卖出"
    category: "杠杆交易"
    difficulty: advanced
    description: "投资者借入证券后卖出，并在未来买回归还的交易方式。"
    aliases: ["融券", "Short Selling"]
    prerequisites: [brokerage-account, leverage]

  - id: securities-lending
    name: "转融通"
    category: "杠杆交易"
    difficulty: advanced
    description: "证券金融公司向证券公司提供资金或证券，再由证券公司用于融资融券业务的机制。"
    aliases: ["转融券", "Securities Lending"]
    prerequisites: [margin-trading, short-selling]

  - id: block-trade
    name: "大宗交易"
    category: "交易规则"
    difficulty: intermediate
    description: "达到规定规模的证券交易，通过专门平台按规则完成。"
    aliases: ["Block Trade"]
    prerequisites: [secondary-market]

  - id: commission
    name: "佣金"
    category: "交易成本"
    difficulty: beginner
    description: "投资者向证券公司支付的交易服务费用。"
    aliases: ["券商佣金", "Commission"]
    prerequisites: [order]

  - id: stamp-duty
