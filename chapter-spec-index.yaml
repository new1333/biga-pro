version: 1
title: "A股投资知识学习网站章节规格索引"
depends_on:
  component_spec: "component-spec.md"
  glossary: "glossary.yaml"
  course_map: "course-map.yaml"

source_of_truth:
  chapter_order: "course-map.yaml modules[].chapters[]"
  first_terms: "course-map.yaml modules[].chapters[].first_terms"
  components: "course-map.yaml modules[].chapters[].components"
  chart_slots: "course-map.yaml modules[].chapters[].chart_slots"
  term_definitions: "glossary.yaml terms[]"

global_chapter_contract:
  no_course_body_in_planning_files: true
  one_chapter_per_markdown_file: true
  chapter_generation_requires:
    - "读取 component-spec.md"
    - "读取 glossary.yaml"
    - "读取 course-map.yaml"
    - "读取 chapter-spec-index.yaml"
    - "只生成当前 chapter_id 对应的正文文件"
  frontmatter_required:
    - chapter_id
    - title
    - module_id
    - batch
    - difficulty
    - first_terms
    - prerequisite_chapters
    - components_used
    - chart_slots
  term_rules:
    first_appearance: "只解释当前章节 first_terms 中的术语。"
    repeat_appearance: "已在前序章节解释过的术语，必须写成 <Term id=\"term-id\" />。"
    forbidden: "不得在后续章节重复定义已解释术语；不得引入 glossary.yaml 之外的正式术语。"
    alias_policy: "术语别名只能用于首次解释；后续应使用 <Term id=\"term-id\" /> 组件引用。"
  component_rules:
    term_component: "Term"
    risk_component: "InvestRiskNotice"
    chart_components: [VizChart, VizFormula, VizTimeline, VizProcessFlow, VizMermaid, VizECharts]
    data_component: "BaseDataSource"
    interaction_components: [LearnQuiz, LearnReflection, LearnCaseStudy, LearnProgress]
  chart_rules:
    default_max_charts_per_chapter: 1
    use_only_declared_chart_slots: true
    chart_required_only_when_chart_slots_not_empty: true
    chart_caption_required: true
    data_source_required_for_market_or_financial_data: true
  assessment_rules:
    beginner_chapter: "最多一个 LearnQuiz 或 LearnReflection。"
    intermediate_chapter: "可包含一个 LearnQuiz 和一个 LearnReflection。"
    advanced_chapter: "优先使用 LearnCaseStudy 或 LearnReflection，不做投资建议。"
  scope_rules:
    current_a_share_path: "正文只围绕A股完整闭环展开。"
    bridge_only: "只解释边界和术语，不展开港股、美股、币圈等未来模块正文。"
    advanced_boundary: "只说明工具边界、风险和适用前提，不鼓励新手使用高风险工具。"

chapter_defaults:
  generation_status: "planned"
  output_format: "markdown"
  route_base: "/course"
  allowed_content_blocks:
    - "chapter_goal"
    - "prerequisite_check"
    - "first_term_explanations"
    - "structured_explanation"
    - "component_examples"
    - "risk_notice"
    - "quiz_or_reflection"
  forbidden_content_blocks:
    - "unplanned_term_definition"
    - "specific_buy_sell_recommendation"
    - "unverified_market_data"
    - "future_scope_deep_dive_in_current_path"

