      - id: c01-01
        title: "证券、股票与公司权益"
      - id: c01-02
        title: "A股市场与交易场所"
      - id: c01-03
        title: "跨市场名称与未来扩展边界"
      - id: c01-04
        title: "投资前的风险边界与学习目标"
    prerequisites: []
    new_terms:
      - securities
      - stock
      - share
      - listed-company
      - shareholder
      - equity
      - market-cap
      - total-share-capital
      - free-float
