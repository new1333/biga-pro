version: 1
title: "A股投资知识学习网站生成批次计划"
source: "course-map.yaml"
rules:
  batch_size: "每批 5 到 10 章"
  dependency_order: "低层知识先生成，高层知识后生成"
  same_batch_principle: "同一批次内章节尽量依赖相同前置知识"
  content_policy: "只用于正文生成调度，不包含课程正文"

